# --- AIS preprocessing (Preprocess_ais.py) ---
timestep_minutes: 5         # model time grid that Pass 2 interpolates onto

# Speed
sog_min: 0.25               # kn; slower points count as stationary and are removed
sog_max: 45                 # kn; reported sog above this is not trusted, speeds are clipped here
max_disagreement: 5         # kn; reported sog is replaced by position-derived speed if they differ by more
max_jump_kn: 50             # kn; implied speed above this marks a GPS jump

# Gap filling (Pass 1 segments and cross-day stitching use the same rules)
max_fill_minutes: 30        # longest reporting gap that gets interpolated
max_fill_nm: 5.0            # longest straight line a filled gap may cover
min_points: 3               # segments shorter than this are dropped
